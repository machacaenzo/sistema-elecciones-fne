
<main class="auth-page-wrapper">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">
        <section class="auth-container text-center">

          <div class="auth-header">
            <h1><i class="bi bi-envelope-check-fill text-success" style="font-size: 3rem;"></i></h1>
            <h1 class="mt-3">¡Un último paso!</h1>
            <p class="text-secondary">
              Hemos enviado un enlace de verificación a tu correo electrónico. Por favor, haz clic en él para activar tu cuenta y poder iniciar sesión.
            </p>
          </div>

          <div class="mt-4">
            <button class="btn-custom btn-primary" (click)="resendVerification()" [disabled]="isSending()">
              @if(isSending()){
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                <span>Enviando...</span>
              } @else {
                <span>Reenviar Correo</span>
              }
            </button>
          </div>

          <p class="auth-link">
            <a routerLink="/login">Volver a Iniciar Sesión</a>
          </p>

        </section>
      </div>
    </div>
  </div>
</main>
