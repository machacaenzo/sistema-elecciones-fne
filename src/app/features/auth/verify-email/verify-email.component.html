<main class="min-h-screen w-full flex items-center justify-center p-4 relative overflow-hidden bg-cover bg-center bg-no-repeat"
      style="background-image: url('assets/FONDO.jpg');">
  
  <!-- CAPA OSCURA DE CINE -->
  <div class="absolute inset-0 bg-black/80 backdrop-blur-[3px]"></div>

  <!-- DESTELLO DORADO AMBIENTAL -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-[#C5A059]/15 rounded-full blur-[100px] pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">
    
    <!-- TARJETA EN NEGRO Y ORO (ESTILO GALA ENZO) -->
    <section class="backdrop-blur-2xl bg-[#050505]/90 border border-[#C5A059]/40 rounded-3xl p-8 sm:p-10 shadow-[0_0_60px_rgba(197,160,89,0.25)] text-center transition-all duration-300 hover:border-[#C5A059]/70">
      
      <!-- ICONO DE CORREO EN DISCO DE VIDRIO ESMERILADO -->
      <div class="relative inline-flex items-center justify-center w-24 h-24 rounded-full bg-white/[0.12] backdrop-blur-md border border-[#C5A059]/50 shadow-[0_0_35px_rgba(197,160,89,0.35)] mb-5">
        <div class="absolute inset-0 rounded-full bg-[#C5A059]/20 blur-md pointer-events-none"></div>
        <i class="bi bi-envelope-check-fill text-4xl text-[#C5A059] drop-shadow-[0_0_10px_rgba(197,160,89,0.6)]"></i>
      </div>

      <!-- TEXTOS -->
      <h1 class="text-2xl font-black text-white tracking-wide">¡Un último paso!</h1>
      <p class="text-xs text-[#F3E7C4] font-bold uppercase tracking-widest mt-1 mb-4">Verificación de Cuenta</p>
      
      <p class="text-sm text-neutral-300 leading-relaxed mb-6">
        Hemos enviado un enlace de confirmación a tu correo electrónico. Por favor, hacé clic en el enlace para activar tu cuenta y poder ingresar al escrutinio.
      </p>

      <!-- BOTÓN REENVIAR: DORADO METÁLICO (ESTILO ENZO) -->
      <button 
        type="button" 
        (click)="resendVerification()" 
        [disabled]="isSending()"
        class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-b from-[#F3E7C4] via-[#C5A059] to-[#8C6D2D] text-[#0A0D14] text-xs font-black uppercase tracking-wider shadow-[0_4px_25px_rgba(197,160,89,0.35)] border border-[#FFF3D1]/50 hover:scale-[1.02] active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 flex items-center justify-center gap-2 mb-4"
      >
        @if (isSending()) {
          <span class="inline-block w-4 h-4 border-2 border-[#0A0D14] border-t-transparent rounded-full animate-spin"></span>
          <span>Reenviando enlace...</span>
        } @else {
          <i class="bi bi-arrow-repeat text-base"></i>
          <span>REENVIAR CORREO</span>
        }
      </button>

      <!-- VOLVER AL LOGIN -->
      <div class="pt-3 border-t border-[#C5A059]/20">
        <a routerLink="/login" class="inline-flex items-center gap-2 text-xs text-[#F3E7C4] font-bold hover:underline transition-colors">
          <i class="bi bi-arrow-left"></i>
          <span>Volver a Iniciar Sesión</span>
        </a>
      </div>

    </section>

    <!-- PIE INSTITUCIONAL -->
    <p class="text-center text-xs text-neutral-500 mt-5 tracking-wide">
      Fiesta Nacional de los Estudiantes &bull; San Salvador de Jujuy
    </p>

  </div>
</main>
