<div class="min-h-screen bg-[#050505] flex items-center justify-center p-4">
  
  <!-- CONTENEDOR PRINCIPAL: VIDRIO ESMERILADO -->
  <div class="w-full max-w-4xl backdrop-blur-2xl bg-white/5 border border-white/10 rounded-[2.5rem] shadow-2xl overflow-hidden animate-fadeIn">
    
    <!-- CABECERA ESTILO GALA -->
    <div class="px-10 py-8 border-b border-white/5 bg-gradient-to-r from-[#C5A059]/15 to-transparent">
      <h1 class="text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-[#F3E7C4] via-[#C5A059] to-[#8C6D2D]">
        PERFIL DE USUARIO
      </h1>
      <p class="text-[10px] uppercase tracking-[0.3em] text-[#F3E7C4]/60 font-bold mt-1">Gestión de credenciales oficiales</p>
    </div>

    @if(currentUser(); as user){
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="p-10">
        
        <div class="grid grid-cols-1 md:grid-cols-12 gap-12 items-center">
          
          <!-- COLUMNA IZQUIERDA: FOTO (4 de 12 columnas) -->
          <div class="md:col-span-5 flex flex-col items-center">
            <div class="relative group">
              <!-- Marco de la foto con sombra dorada -->
              <div class="w-56 h-72 rounded-[2rem] overflow-hidden border border-[#C5A059]/40 shadow-[0_0_40px_rgba(197,160,89,0.15)] bg-black/40">
                <img [src]="previewImg() || 'assets/user-default.jpg'" alt="Avatar" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                
                <!-- Overlay para cambiar foto -->
                <div (click)="fileInput.click()" class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
                   <div class="w-12 h-12 rounded-full border border-[#F3E7C4] flex items-center justify-center mb-2">
                     <i class="bi bi-camera text-[#F3E7C4] text-xl"></i>
                   </div>
                   <span class="text-[#F3E7C4] text-[10px] font-black tracking-widest">EDITAR FOTO</span>
                </div>
              </div>

              <!-- Badge de Rol (Como en tus referencias) -->
              <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 px-8 py-2 rounded-full bg-gradient-to-b from-[#F3E7C4] via-[#C5A059] to-[#8C6D2D] text-[#0A0D14] text-[10px] font-bold uppercase tracking-[0.2em] shadow-xl whitespace-nowrap">
                {{ user.rol || 'ALUMNO' }}
              </div>
            </div>

            <input type="file" #fileInput hidden (change)="onFileSelected($event)" accept="image/png, image/jpeg">
            
            @if (previewImg()) {
              <button type="button" (click)="removePhoto()" class="mt-8 text-red-500/60 text-[9px] font-bold uppercase tracking-widest hover:text-red-400 transition-colors">
                Eliminar foto actual
              </button>
            }
          </div>

          <!-- COLUMNA DERECHA: CAMPOS (7 de 12 columnas) -->
          <div class="md:col-span-7 flex flex-col gap-6">
            
            <!-- Nombre -->
            <div class="space-y-2">
              <label class="text-[10px] uppercase font-bold text-[#C5A059] ml-4 tracking-[0.2em]">Nombre</label>
              <div class="relative">
                <input formControlName="nombre" type="text" 
                  class="w-full rounded-full bg-white/5 border border-white/10 px-8 py-4 text-white text-sm focus:outline-none focus:border-[#C5A059]/50 transition-all">
                <i class="bi bi-person-fill absolute right-6 top-4 text-white/20"></i>
              </div>
            </div>

            <!-- Apellido -->
            <div class="space-y-2">
              <label class="text-[10px] uppercase font-bold text-[#C5A059] ml-4 tracking-[0.2em]">Apellido</label>
              <div class="relative">
                <input formControlName="apellido" type="text" 
                  class="w-full rounded-full bg-white/5 border border-white/10 px-8 py-4 text-white text-sm focus:outline-none focus:border-[#C5A059]/50 transition-all">
                <i class="bi bi-person-fill absolute right-6 top-4 text-white/20"></i>
              </div>
            </div>

            <!-- Email (Píldora oscura bloqueada) -->
            <div class="space-y-2">
              <label class="text-[10px] uppercase font-bold text-white/30 ml-4 tracking-[0.2em]">Correo Electrónico Oficial</label>
              <div class="w-full rounded-full bg-black/40 border border-white/5 px-8 py-4 text-white/30 text-sm italic overflow-hidden text-ellipsis">
                {{ user.email }}
              </div>
            </div>

            <!-- BOTÓN GUARDAR (Estilo Enzo/Gala) -->
            <div class="pt-6 flex justify-end">
              <button 
                type="submit"
                [disabled]="isSubmitting() || profileForm.pristine"
                class="px-12 py-4 rounded-2xl bg-gradient-to-b from-[#F3E7C4] via-[#C5A059] to-[#8C6D2D] text-[#0A0D14] font-black text-[11px] uppercase tracking-[0.2em] shadow-[0_10px_30px_rgba(197,160,89,0.3)] hover:scale-105 active:scale-95 disabled:opacity-20 disabled:grayscale transition-all"
              >
                @if (isSubmitting()) {
                  <span>PROCESANDO...</span>
                } @else {
                  <span>GUARDAR CAMBIOS</span>
                }
              </button>
            </div>

          </div>
        </div>
      </form>
    }
  </div>
</div>
