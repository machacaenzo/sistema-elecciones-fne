<div class="min-h-[85vh] w-full flex items-center justify-center p-4 sm:p-10 animate-fadeIn">
  
  <!-- CONTENEDOR TIPO HOLOGRAMA (SIN FONDO SÓLIDO) -->
  <div class="w-full max-w-5xl backdrop-blur-xl bg-white/[0.03] border-2 border-[#C5A059]/30 rounded-[3.5rem] shadow-[0_0_50px_rgba(197,160,89,0.1)] overflow-hidden relative">
    
    <!-- RESPLANDOR DORADO DE FONDO (SUTIL) -->
    <div class="absolute -top-20 -right-20 w-80 h-80 bg-[#C5A059]/10 rounded-full blur-[100px] pointer-events-none"></div>

    <!-- CABECERA FLOTANTE -->
    <div class="px-10 py-12 border-b border-[#C5A059]/20 flex flex-col items-center text-center">
      <h1 class="text-4xl md:text-5xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-[#F3E7C4] via-[#C5A059] to-[#8C6D2D] drop-shadow-sm">
        PERFIL DE EMBAJADOR
      </h1>
      <div class="flex items-center gap-4 mt-3">
        <div class="h-[1px] w-16 bg-gradient-to-r from-transparent to-[#C5A059]"></div>
        <p class="text-[10px] uppercase tracking-[0.5em] text-[#F3E7C4] font-black opacity-70">Identidad Real del Escrutinio</p>
        <div class="h-[1px] w-16 bg-gradient-to-l from-transparent to-[#C5A059]"></div>
      </div>
    </div>

    @if (currentUser(); as user) {
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="p-8 md:p-16">
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-16 items-center">
          
          <!-- LADO IZQUIERDO: RETRATO FLOTANTE -->
          <div class="lg:col-span-5 flex flex-col items-center">
            <div class="relative group">
              
              <!-- Aura de Luz tras la foto -->
              <div class="absolute inset-0 bg-[#C5A059]/20 blur-[40px] rounded-full scale-75 group-hover:scale-110 transition-transform duration-1000"></div>

              <!-- El Marco de Cristal Editorial -->
              <div class="relative w-60 h-80 sm:w-72 sm:h-96 rounded-[3rem] overflow-hidden border-2 border-[#C5A059]/50 shadow-[0_0_40px_rgba(0,0,0,0.5)] bg-black/20 backdrop-blur-md">
                <img [src]="previewImg() || 'assets/user-default.jpg'" alt="Perfil" 
                     class="w-full h-full object-cover transition-transform duration-[2s] group-hover:scale-110">
                
                <!-- Botón Editar (Solo aparece al pasar el mouse) -->
                <div (click)="fileInput.click()" class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-500 cursor-pointer">
                  <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="#F3E7C4" class="mb-2 animate-bounce" viewBox="0 0 16 16">
                    <path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"/>
                    <path d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4H2zm.5 2a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1zm9 2.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0z"/>
                  </svg>
                  <span class="text-[#F3E7C4] text-[9px] font-black tracking-[0.4em]">CAMBIAR IMAGEN</span>
                </div>
              </div>

              <!-- Placa Metálica Inferior -->
              <div class="absolute -bottom-5 left-1/2 -translate-x-1/2 px-12 py-3 rounded-full bg-gradient-to-r from-[#8C6D2D] via-[#F3E7C4] to-[#8C6D2D] border border-white/50 shadow-[0_10px_30px_rgba(0,0,0,0.6)]">
                <span class="text-[#0A0D14] text-xs font-black uppercase tracking-[0.3em] italic">{{ user.rol || 'JURADO' }}</span>
              </div>
            </div>

            <input type="file" #fileInput hidden (change)="onFileSelected($event)" accept="image/*">
            
            @if (previewImg()) {
              <button type="button" (click)="removePhoto()" class="mt-12 text-[#C5A059]/50 text-[10px] font-bold uppercase tracking-[0.2em] hover:text-red-500 transition-all">
                Remover Imagen Actual
              </button>
            }
          </div>

          <!-- LADO DERECHO: CAMPOS DE CRISTAL -->
          <div class="lg:col-span-7 flex flex-col gap-10">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-8">
              <!-- Nombre -->
              <div class="space-y-3 group">
                <label class="text-[10px] uppercase font-black text-[#C5A059] ml-6 tracking-[0.4em] opacity-80 group-focus-within:opacity-100 transition-opacity">Nombre de Gala</label>
                <input formControlName="nombre" type="text" 
                  class="w-full rounded-full bg-white/[0.05] border border-white/10 px-8 py-5 text-white text-lg focus:outline-none focus:border-[#C5A059]/60 focus:bg-white/[0.08] transition-all shadow-inner">
              </div>

              <!-- Apellido -->
              <div class="space-y-3 group">
                <label class="text-[10px] uppercase font-black text-[#C5A059] ml-6 tracking-[0.4em] opacity-80">Apellido de Gala</label>
                <input formControlName="apellido" type="text" 
                  class="w-full rounded-full bg-white/[0.05] border border-white/10 px-8 py-5 text-white text-lg focus:outline-none focus:border-[#C5A059]/60 focus:bg-white/[0.08] transition-all shadow-inner">
              </div>
            </div>

            <!-- Email (Lectura - Ultra Transparente) -->
            <div class="space-y-3">
              <label class="text-[10px] uppercase font-black text-white/30 ml-6 tracking-[0.4em]">Identificación Digital</label>
              <div class="w-full rounded-full bg-black/30 border border-white/5 px-8 py-5 text-white/40 text-sm italic flex justify-between items-center backdrop-blur-sm">
                <span>{{ user.email }}</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" class="opacity-20 text-[#C5A059]">
                  <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
                </svg>
              </div>
            </div>

            <!-- BOTÓN GUARDAR (EL "SOL" DEL DISEÑO) -->
            <div class="pt-10 flex justify-end">
              <button 
                type="submit"
                [disabled]="isSubmitting() || profileForm.pristine"
                class="relative px-16 py-5 rounded-full overflow-hidden group shadow-[0_20px_50px_rgba(197,160,89,0.2)] transition-all active:scale-95 disabled:opacity-20 disabled:grayscale"
              >
                <!-- Fondo Dorado Metálico -->
                <div class="absolute inset-0 bg-gradient-to-r from-[#8C6D2D] via-[#F3E7C4] to-[#8C6D2D] group-hover:scale-110 transition-transform duration-500"></div>
                
                <!-- Brillo que recorre el botón -->
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/40 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000 ease-in-out"></div>

                <span class="relative text-[#0A0D14] font-black text-xs uppercase tracking-[0.4em] flex items-center gap-4">
                  @if (isSubmitting()) {
                    <span class="w-4 h-4 border-2 border-black/30 border-t-black rounded-full animate-spin"></span>
                  }
                  {{ isSubmitting() ? 'SINCRONIZANDO' : 'GUARDAR CAMBIOS' }}
                </span>
              </button>
            </div>

          </div>
        </div>
      </form>
    }
  </div>
</div>
