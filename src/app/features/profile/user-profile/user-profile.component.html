<div class="space-y-6 text-neutral-100 font-sans pb-10 flex justify-center">

  <!-- TARJETA PRINCIPAL: GLASS OSCURO CON BORDE DORADO -->
  <div class="w-full max-w-4xl backdrop-blur-2xl bg-[#050505]/85 border border-[#C5A059]/40 rounded-3xl sm:rounded-[2.5rem] shadow-[0_20px_60px_rgba(0,0,0,0.9),0_0_30px_rgba(197,160,89,0.15)] overflow-hidden animate-fadeIn transition-all hover:border-[#C5A059]/60">

    <!-- CABECERA DE GALA -->
    <div class="px-6 sm:px-10 py-6 sm:py-7 border-b border-[#C5A059]/25 bg-gradient-to-r from-[#C5A059]/20 via-black/40 to-transparent flex items-center justify-between">
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-2xl bg-[#0A0A0A] border border-[#C5A059]/60 flex items-center justify-center text-[#F3E7C4] text-xl shadow-[0_0_20px_rgba(197,160,89,0.25)] flex-shrink-0">
          <i class="bi bi-person-badge-fill text-[#C5A059]"></i>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-[#FFF3D1] via-[#F3E7C4] to-[#C5A059] drop-shadow-[0_2px_15px_rgba(197,160,89,0.25)]">
            Perfil de Usuario
          </h1>
          <p class="text-[10px] sm:text-xs uppercase tracking-[0.2em] text-[#F3E7C4] font-bold mt-0.5">Gestión de credenciales y datos oficiales</p>
        </div>
      </div>
    </div>

    <!-- CUERPO DEL PERFIL -->
    @if (currentUser(); as user) {
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="p-6 sm:p-10">

        <div class="grid grid-cols-1 md:grid-cols-12 gap-8 sm:gap-12 items-center">

          <!-- COLUMNA IZQUIERDA: FOTO DE PERFIL -->
          <div class="md:col-span-5 flex flex-col items-center">
            <div class="relative group">

              <!-- Marco de la foto con resplandor dorado -->
              <div class="w-48 h-64 sm:w-56 sm:h-72 rounded-3xl overflow-hidden border-2 border-[#C5A059]/50 shadow-[0_0_35px_rgba(197,160,89,0.25)] bg-black/60 relative">
                <img [src]="previewImg() || 'assets/user-default.jpg'"
                     alt="Avatar"
                     class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">

                <!-- Overlay táctil para cambiar foto -->
                <div (click)="fileInput.click()"
                     class="absolute inset-0 bg-black/75 backdrop-blur-[2px] flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
                  <div class="w-12 h-12 rounded-2xl bg-[#0A0A0A] border border-[#C5A059] flex items-center justify-center mb-2 shadow-lg">
                    <i class="bi bi-camera-fill text-[#C5A059] text-xl"></i>
                  </div>
                  <span class="text-[#F3E7C4] text-xs font-black tracking-wider uppercase">Cambiar Foto</span>
                </div>
              </div>

              <!-- Badge Flotante de Rol -->
              <div class="absolute -bottom-3.5 left-1/2 -translate-x-1/2 px-6 sm:px-8 py-2 rounded-full bg-gradient-to-b from-[#FFF3D1] via-[#C5A059] to-[#8C6D2D] text-[#0A0D14] text-xs font-black uppercase tracking-wider shadow-[0_4px_20px_rgba(197,160,89,0.4)] border border-[#FFF3D1]/70 whitespace-nowrap">
                {{ user.rol || 'JURADO' }}
              </div>
            </div>

            <input type="file" #fileInput hidden (change)="onFileSelected($event)" accept="image/png, image/jpeg">

            @if (previewImg()) {
              <button type="button"
                      (click)="removePhoto()"
                      class="mt-7 text-rose-400 hover:text-rose-300 text-xs font-bold uppercase tracking-wider transition-colors flex items-center gap-1.5">
                <i class="bi bi-trash3"></i>
                <span>Eliminar foto actual</span>
              </button>
            }
          </div>

          <!-- COLUMNA DERECHA: CAMPOS DEL FORMULARIO -->
          <div class="md:col-span-7 flex flex-col gap-4 sm:gap-5">

            <!-- Campo: Nombre -->
            <div>
              <label class="block text-xs font-bold text-[#F3E7C4] uppercase tracking-wider mb-1.5">Nombre</label>
              <div class="relative">
                <input formControlName="nombre"
                       type="text"
                       placeholder="Tu nombre"
                       class="w-full px-4 py-3 bg-[#050505] border border-[#C5A059]/35 focus:border-[#C5A059] rounded-2xl text-white text-sm focus:outline-none focus:ring-1 focus:ring-[#C5A059] transition-all">
                <i class="bi bi-person-fill absolute right-4 top-1/2 -translate-y-1/2 text-neutral-500 text-base"></i>
              </div>
            </div>

            <!-- Campo: Apellido -->
            <div>
              <label class="block text-xs font-bold text-[#F3E7C4] uppercase tracking-wider mb-1.5">Apellido</label>
              <div class="relative">
                <input formControlName="apellido"
                       type="text"
                       placeholder="Tu apellido"
                       class="w-full px-4 py-3 bg-[#050505] border border-[#C5A059]/35 focus:border-[#C5A059] rounded-2xl text-white text-sm focus:outline-none focus:ring-1 focus:ring-[#C5A059] transition-all">
                <i class="bi bi-person-fill absolute right-4 top-1/2 -translate-y-1/2 text-neutral-500 text-base"></i>
              </div>
            </div>

            <!-- Campo: Correo Electrónico (Solo Lectura) -->
            <div>
              <label class="block text-xs font-bold text-neutral-400 uppercase tracking-wider mb-1.5">Correo Electrónico (Institucional)</label>
              <div class="relative">
                <input type="email"
                       [value]="user.email"
                       disabled
                       class="w-full px-4 py-3 bg-[#0A0A0A]/70 border border-white/5 rounded-2xl text-neutral-400 text-sm italic cursor-not-allowed">
                <i class="bi bi-lock-fill absolute right-4 top-1/2 -translate-y-1/2 text-neutral-500 text-base"></i>
              </div>
            </div>

            <!-- BOTÓN GUARDAR CAMBIOS -->
            <div class="pt-4 sm:pt-6 flex justify-end">
              <button
                type="submit"
                [disabled]="isSubmitting() || profileForm.pristine"
                class="w-full sm:w-auto px-10 py-3.5 rounded-2xl bg-gradient-to-b from-[#FFF3D1] via-[#C5A059] to-[#8C6D2D] text-[#0A0D14] font-black text-xs uppercase tracking-wider shadow-[0_0_30px_rgba(197,160,89,0.4)] border border-[#FFF3D1]/70 hover:scale-[1.02] active:scale-[0.98] disabled:opacity-30 disabled:pointer-events-none transition-all flex items-center justify-center gap-2"
              >
                @if (isSubmitting()) {
                  <span class="inline-block w-4 h-4 border-2 border-[#0A0D14] border-t-transparent rounded-full animate-spin"></span>
                  <span>Guardando...</span>
                } @else {
                  <i class="bi bi-check-circle-fill"></i>
                  <span>Guardar Cambios</span>
                }
              </button>
            </div>

          </div>
        </div>
      </form>
    }
  </div>

</div>
