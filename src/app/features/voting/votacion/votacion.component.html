<!-- CONTENEDOR PRINCIPAL SIN FONDO SÓLIDO (HEREDA EL FONDO DEL DASHBOARD) -->
<div class="w-full min-h-screen bg-transparent text-neutral-100 font-sans p-4 sm:p-8 animate-fadeIn">

  <!-- ========================================================= -->
  <!-- PANTALLA 1: LISTADO DE ELECCIONES (sub-componente)        -->
  <!-- ========================================================= -->
  @if (!isVotingMode()) {
    <app-eleccion-lista
      [todasLasElecciones]="todasLasElecciones()"
      (verDetalle)="openDetalleMode($event)"
      (ingresarVotar)="openVotingMode($event)">
    </app-eleccion-lista>
  }

  <!-- ========================================================= -->
  <!-- MODAL DE VOTACIÓN (PANTALLA COMPLETA INTEGRADA)           -->
  <!-- ========================================================= -->
  @if (isVotingMode() && selectedEleccion(); as eleccion) {
    <div class="fixed inset-0 z-[60] flex flex-col bg-black/40 backdrop-blur-3xl animate-fadeIn overflow-hidden">

      <div class="flex-1 overflow-hidden flex flex-col relative">

        <!-- PANTALLA A: SELECCIONAR TANDA -->
        @if (!categoriaSeleccionada()) {
          <!-- Barra superior de Pantalla A con botón de cerrar -->
          <div class="w-full px-6 sm:px-10 py-4 border-b border-white/10 bg-black/40 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
              <img src="assets/logo-fne.png" class="w-8 h-8 sm:w-9 sm:h-9 object-contain" alt="FNE">
              <span class="text-xs sm:text-sm font-black text-[#F3E7C4] tracking-widest uppercase">{{ eleccion.nombre }}</span>
            </div>
            <button type="button"
                    (click)="closeVotingMode()"
                    title="Cerrar Mesa"
                    class="group p-1 rounded-full hover:bg-white/10 transition-all flex-shrink-0 cursor-pointer">
              <img src="assets/BOTON.png" class="w-8 h-8 sm:w-9 sm:h-9 object-contain group-hover:rotate-90 transition-transform duration-300">
            </button>
          </div>

          <app-votacion-tanda
            [eleccionId]="eleccion.id!"
            (tandaSeleccionada)="seleccionarTanda($event)">
          </app-votacion-tanda>
        }

        <!-- PANTALLA B: MESA DE CALIFICACIÓN (TIENE SU PROPIO BOTÓN DE CERRAR INTEGRADO) -->
        @else if (!isReviewMode()) {
          <app-votacion-mesa
            [candidatas]="candidatas()"
            [candidatasFiltradas]="getCandidatasFiltradas()"
            [eleccion]="eleccion"
            [categoriaSeleccionada]="categoriaSeleccionada()!"
            [currentStep]="currentStep()"
            [carouselImageIndex]="carouselImageIndex()"
            [votacionForm]="votacionForm"
            [tandaFirmada]="tandaFirmada(categoriaSeleccionada()!)"
            (volverATandas)="categoriaSeleccionada.set(null)"
            (cerrarMesa)="closeVotingMode()"
            (candidatoSeleccionado)="selectCandidate($event)"
            (sliderActualizado)="updateSliderValue($event.index, $event.controlName, $event.event)"
            (irARevisar)="enterReviewMode()">
          </app-votacion-mesa>
        }

        <!-- PANTALLA C: AUDITORÍA Y FIRMA -->
        @else {
          <!-- Barra superior de Pantalla C con botón de cerrar -->
          <div class="w-full px-6 sm:px-10 py-4 border-b border-white/10 bg-black/40 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
              <img src="assets/logo-fne.png" class="w-8 h-8 sm:w-9 sm:h-9 object-contain" alt="FNE">
              <span class="text-xs sm:text-sm font-black text-[#F3E7C4] tracking-widest uppercase">AUDITORÍA: {{ eleccion.nombre }}</span>
            </div>
            <button type="button"
                    (click)="closeVotingMode()"
                    title="Cerrar Mesa"
                    class="group p-1 rounded-full hover:bg-white/10 transition-all flex-shrink-0 cursor-pointer">
              <img src="assets/BOTON.png" class="w-8 h-8 sm:w-9 sm:h-9 object-contain group-hover:rotate-90 transition-transform duration-300">
            </button>
          </div>

          <app-votacion-auditoria
            [candidatas]="candidatas()"
            [candidatasFiltradas]="getCandidatasFiltradas()"
            [eleccion]="eleccion"
            [categoriaSeleccionada]="categoriaSeleccionada()!"
            [votacionForm]="votacionForm"
            [tandaFirmada]="tandaFirmada(categoriaSeleccionada()!)"
            [isSubmitting]="isSubmitting()"
            (editarCandidato)="selectCandidate($event)"
            (firmarActa)="onSubmit()"
            (volverATandas)="categoriaSeleccionada.set(null)"
            (volverAMesa)="isReviewMode.set(false)"
            (alternarTanda)="toggleCategoriaAudit()">
          </app-votacion-auditoria>
        }

      </div>
    </div>
  }

  <!-- MODAL DE DETALLE -->
  @if (isDetalleMode() && selectedEleccionParaDetalle(); as eleccion) {
    <div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-xl animate-fadeIn" (click)="closeDetalleMode()">
      <div class="w-full max-w-5xl max-h-[92vh] flex flex-col overflow-hidden" (click)="$event.stopPropagation()">
        <app-detalle-eleccion
          [eleccion]="eleccion"
          [haVotado]="haVotado(eleccion.id!)"
          (closeModal)="closeDetalleMode()"
          (iniciarVotacion)="handleIniciarVotacion(eleccion)">
        </app-detalle-eleccion>
      </div>
    </div>
  }

</div>
